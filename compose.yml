services:
  app:
    image: ghcr.io/digitaleflex/nba
    # Force le pull de la derniere image a chaque `up -d` pour eviter
    # d'utiliser une image locale obsolete (incident 2026-07-13).
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: "https://access.signauxx.com"
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: "${NEXT_PUBLIC_VAPID_PUBLIC_KEY}"
    networks:
      - nba
      - proxy
    env_file: .env
    environment:
      QUEUE_ENABLED: "true"
      WS_ENABLED: "${WS_ENABLED:-false}"
      WS_PORT: "${WS_PORT:-3001}"
      RESEND_FROM_EMAIL: '"Signaux NeverBrokeAgain" <signaux@signauxx.com>'
    depends_on:
      nba-redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/public/health', (r) => { r.on('data', () => {}); r.on('end', () => { process.exit(r.statusCode < 400 ? 0 : 1) }) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - nba-storage:/app/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nba-app.rule=Host(`access.signauxx.com`)"
      - "traefik.http.routers.nba-app.priority=100"
      - "traefik.http.routers.nba-app.entrypoints=websecure"
      - "traefik.http.routers.nba-app.tls=true"
      - "traefik.http.routers.nba-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nba-app.service=nba-app"
      - "traefik.http.services.nba-app.loadbalancer.server.port=3000"
      # WebSocket (Socket.IO) : route /socket.io/ vers le worker sur le port 3001
      - "traefik.http.routers.nba-ws.rule=Host(`access.signauxx.com`) && PathPrefix(`/socket.io/`)"
      - "traefik.http.routers.nba-ws.priority=200"
      - "traefik.http.routers.nba-ws.entrypoints=websecure"
      - "traefik.http.routers.nba-ws.tls=true"
      - "traefik.http.routers.nba-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.nba-ws.loadbalancer.server.port=3001"

  nba-redis:
    image: valkey/valkey:8-alpine
    networks:
      - nba
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0", "--dir", "/data", "--save", "60", "1", "--appendonly", "yes"]
    # Bind sur 0.0.0.0 (sécurisé par --requirepass)
    # Tailscale ACLs bloquent l'accès public non-autorisé par défaut
    ports:
      - "6379:6379"
    volumes:
      - nba-redis-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nba-minio:
    image: minio/minio:latest
    container_name: nba-minio
    volumes:
      - nba-minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console d'administration
    restart: unless-stopped
    networks:
      - nba

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    networks:
      - nba
    env_file: .env
    environment:
      QUEUE_ENABLED: "true"
      RESEND_FROM_EMAIL: '"Signaux NeverBrokeAgain" <signaux@signauxx.com>'
    depends_on:
      nba-redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  nba-imgproxy:
    image: darthsim/imgproxy:latest
    container_name: nba-imgproxy
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_S3_ENDPOINT: "http://nba-minio:9000"
    ports:
      - "8080:8080" # imgproxy API
    depends_on:
      - nba-minio
    restart: unless-stopped
    networks:
      - nba

networks:
  nba:
  proxy:
    external: true

volumes:
  nba-storage:
  nba-redis-data:
  nba-minio-data:
