services:
  app:
    image: ghcr.io/digitaleflex/nba
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: "https://access.signauxx.com"
    networks:
      - nba
      - proxy
    env_file: .env
    environment:
      QUEUE_ENABLED: "true"
    depends_on:
      nba-redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nba-app.rule=Host(`access.signauxx.com`)"
      - "traefik.http.routers.nba-app.entrypoints=websecure"
      - "traefik.http.routers.nba-app.tls=true"
      - "traefik.http.routers.nba-app.tls.certresolver=myresolver"
      - "traefik.http.services.nba-app.loadbalancer.server.port=3000"

  worker:
    image: ghcr.io/digitaleflex/nba-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    networks:
      - nba
    env_file: .env
    environment:
      QUEUE_ENABLED: "true"
    depends_on:
      app:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  nba-redis:
    image: valkey/valkey:8-alpine
    networks:
      - nba
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0"]
    # Bind sur 0.0.0.0 (sécurisé par --requirepass)
    # Tailscale ACLs bloquent l'accès public non-autorisé par défaut
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  nba:
  proxy:
    external: true
