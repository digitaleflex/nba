services:
  app:
    image: ghcr.io/digitaleflex/nba
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: "https://access.signauxx.com"
    networks:
      - nba
      - proxy
    env_file: .env
    environment:
      QUEUE_ENABLED: "false"
      REDIS_URL: "redis://nba-redis:6379"
    depends_on:
      nba-redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nba-app.rule=Host(`access.signauxx.com`)"
      - "traefik.http.routers.nba-app.entrypoints=websecure"
      - "traefik.http.routers.nba-app.tls=true"
      - "traefik.http.routers.nba-app.tls.certresolver=myresolver"
      - "traefik.http.services.nba-app.loadbalancer.server.port=3000"

  nba-redis:
    image: valkey/valkey:8-alpine
    networks:
      - nba
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  nba:
  proxy:
    external: true
