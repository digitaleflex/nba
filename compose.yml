name: nba

services:
  # ── Maintenance page (mode maintenance automatique) ──
  # S'active via le script deploy.sh. Priorité Traefik 999 > app (1).
  # Ne démarre PAS avec `docker compose up -d` (profil maintenance requis).
  maintenance:
    build:
      context: .
      dockerfile: Dockerfile.maintenance
    profiles:
      - maintenance
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nba-maintenance.rule=Host(`access.signauxx.com`)"
      - "traefik.http.routers.nba-maintenance.priority=999"
      - "traefik.http.routers.nba-maintenance.entrypoints=websecure"
      - "traefik.http.routers.nba-maintenance.tls=true"
      - "traefik.http.routers.nba-maintenance.tls.certresolver=letsencrypt"
      - "traefik.http.services.nba-maintenance.loadbalancer.server.port=80"
    restart: "no"

  # ── Fallback erreurs 502/503 — affiche une belle page au lieu du "Bad Gateway" brut Traefik
  # Doit s'appeler `error-pages` (sans préfixe) car le provider file de Traefik attend http://error-pages:80
  # Utilisé par le middleware `errors` (500-599) du file provider + Docker
  error-pages:
    container_name: error-pages
    build:
      context: .
      dockerfile: Dockerfile.maintenance
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  app:
    # Image immutable par SHA pour reproductibilite ; latest pour compat local/dev.
    image: ghcr.io/digitaleflex/nba:${NBA_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: "https://access.signauxx.com"
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: "${NEXT_PUBLIC_VAPID_PUBLIC_KEY}"
    networks:
      - nba
      - proxy
    env_file: .env
    environment:
      QUEUE_ENABLED: "true"
      WS_ENABLED: "${WS_ENABLED:-true}"
      WS_PORT: "${WS_PORT:-3001}"
      RESEND_FROM_EMAIL: '"Signaux NeverBrokeAgain" <signaux@signauxx.com>'
    depends_on:
      nba-redis:
        condition: service_started
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/public/health', (r) => { r.on('data', () => {}); r.on('end', () => { process.exit(r.statusCode < 400 ? 0 : 1) }) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    volumes:
      - nba-storage:/app/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.nba-app.loadbalancer.server.port=3000"
      - "traefik.http.services.nba-app.loadbalancer.healthcheck.path=/api/public/health"
      - "traefik.http.services.nba-app.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.nba-app.loadbalancer.healthcheck.timeout=3s"
      # Routeur principal de l'app (port 3000)
      # Le conteneur est sur 2 réseaux (nba + proxy) : sans ce label, Traefik
      # peut choisir le réseau interne et ne jamais joindre l'app (404).
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.nba-app.rule=Host(`access.signauxx.com`)"
      # Priorité > catch-all@file (priority 1, HostRegexp `.+`) qui renvoie 404.
      - "traefik.http.routers.nba-app.priority=10"
      - "traefik.http.routers.nba-app.service=nba-app"
      - "traefik.http.routers.nba-app.entrypoints=websecure"
      - "traefik.http.routers.nba-app.tls=true"
      - "traefik.http.routers.nba-app.tls.certresolver=letsencrypt"
      # WebSocket (Socket.IO) : route /socket.io vers le worker sur le port 3001
      - "traefik.http.routers.nba-ws.rule=Host(`access.signauxx.com`) && (PathPrefix(`/socket.io/`) || Path(`/socket.io`))"
      - "traefik.http.routers.nba-ws.priority=200"
      - "traefik.http.routers.nba-ws.service=nba-ws"
      - "traefik.http.routers.nba-ws.entrypoints=websecure"
      - "traefik.http.routers.nba-ws.tls=true"
      - "traefik.http.routers.nba-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.nba-ws.loadbalancer.server.port=3001"

  nba-redis:
    image: valkey/valkey:8-alpine
    networks:
      - nba
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0", "--dir", "/data", "--save", "60", "1", "--appendonly", "yes", "--timeout", "300"]
    # Redis accessible uniquement sur le réseau Docker interne.
    # Pour l'accès externe (VPS2), utiliser Tailscale/WireGuard, pas d'exposition directe.
    expose:
      - "6379"
    volumes:
      - nba-redis-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nba-minio:
    image: minio/minio:latest
    container_name: nba-minio
    volumes:
      - nba-minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000" # API S3 (localhost only - évite conflit + sécu)
      - "127.0.0.1:9001:9001" # Console d'administration
    restart: unless-stopped
    networks:
      - nba

  worker:
    image: ghcr.io/digitaleflex/nba-worker:${NBA_IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile.worker
    networks:
      - nba
    env_file: .env
    environment:
      QUEUE_ENABLED: "true"
      RESEND_FROM_EMAIL: '"Signaux NeverBrokeAgain" <signaux@signauxx.com>'
    depends_on:
      nba-redis:
        condition: service_started
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "tsx workers/queue.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  bull-board:
    image: ghcr.io/digitaleflex/nba-worker:${NBA_IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["pnpm", "exec", "tsx", "workers/bull-board.ts"]
    networks:
      - nba
      - proxy
    env_file: .env
    environment:
      BULL_BOARD_PORT: "3002"
    depends_on:
      nba-redis:
        condition: service_started
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health', (r) => { r.resume(); r.on('end', () => process.exit(r.statusCode < 500 ? 0 : 1)) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.nba-bull.rule=Host(`access.signauxx.com`) && PathPrefix(`/admin/queues`)"
      - "traefik.http.routers.nba-bull.priority=150"
      - "traefik.http.routers.nba-bull.entrypoints=websecure"
      - "traefik.http.routers.nba-bull.tls=true"
      - "traefik.http.routers.nba-bull.tls.certresolver=letsencrypt"
      - "traefik.http.services.nba-bull.loadbalancer.server.port=3002"

  nba-imgproxy:
    image: darthsim/imgproxy:latest
    container_name: nba-imgproxy
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_S3_ENDPOINT: "http://nba-minio:9000"
    ports:
      - "127.0.0.1:8083:8080" # imgproxy API (0.0.0.0:8080 conflit avec digi-innova-webserver)
    depends_on:
      - nba-minio
    restart: unless-stopped
    networks:
      - nba

networks:
  nba:
  proxy:
    external: true

volumes:
  nba-storage:
  nba-redis-data:
  nba-minio-data:
