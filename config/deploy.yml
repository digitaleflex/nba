service: nba

image: digitaleflex/nba

servers:
  web:
    hosts:
      - access.signauxx.com
    proxy: false
    options:
      network: "proxy"
    labels:
      traefik.enable: "true"
      traefik.http.services.nba-app.loadbalancer.server.port: "3000"
      traefik.http.services.nba-app.loadbalancer.healthcheck.path: "/api/public/health"
      traefik.http.services.nba-app.loadbalancer.healthcheck.interval: "30s"
      traefik.http.services.nba-app.loadbalancer.healthcheck.timeout: "3s"
      traefik.http.routers.nba-app.rule: "Host(`access.signauxx.com`)"
      traefik.http.routers.nba-app.priority: "1"
      traefik.http.routers.nba-app.service: "nba-app"
      traefik.http.routers.nba-app.entrypoints: "websecure"
      traefik.http.routers.nba-app.tls: "true"
      traefik.http.routers.nba-app.tls.certresolver: "letsencrypt"

registry:
  server: ghcr.io
  username: digitaleflex
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    NEXT_PUBLIC_APP_URL: "https://access.signauxx.com"
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: "<%= ENV["NEXT_PUBLIC_VAPID_PUBLIC_KEY"] %>"

env:
  clear:
    NODE_ENV: "production"
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    NODE_TLS_REJECT_UNAUTHORIZED: "0"
    NEXT_TELEMETRY_DISABLED: "1"
    BETTER_AUTH_URL: "https://access.signauxx.com"
    NEXT_PUBLIC_APP_URL: "https://access.signauxx.com"
    NEXT_PUBLIC_SUPPORT_EMAIL: "support@signauxx.com"
    RESEND_FROM_EMAIL: '"Signaux NeverBrokeAgain" <signaux@signauxx.com>'
    WS_ENABLED: "true"
    WS_PORT: "3001"
    QUEUE_ENABLED: "true"
    BACKUP_ALERT_EMAIL: "admin@signauxx.com"
    SUPPORT_EMAIL: "support@signauxx.com"
    ADMIN_EMAIL: "admin@signauxx.com"
    CONTACT_EMAIL: "contact@signauxx.com"
    TEAM_EMAIL: "team@signauxx.com"
    B2_BUCKET: "nba-backups"
    B2_ENDPOINT: "s3.us-east-005.backblazeb2.com"
  secret:
    - DATABASE_URL
    - REDIS_URL
    - REDIS_PASSWORD
    - BETTER_AUTH_SECRET
    - RESEND_API_KEY
    - RESEND_WEBHOOK_SECRET
    - NEXT_PUBLIC_VAPID_PUBLIC_KEY
    - B2_APPLICATION_KEY_ID
    - B2_APPLICATION_KEY
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD
    - IMGPROXY_KEY
    - IMGPROXY_SALT

deploy_timeout: 60
readiness_delay: 15

ssh:
  user: audest

volumes:
  - "nba-storage:/app/storage"
