packages:
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry/cli': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  tree-sitter: false
  tree-sitter-json: false
  unrs-resolver: true
