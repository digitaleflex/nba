# Compose file pour VPS2 - Worker uniquement
# Usage: docker compose -f compose.vps2.yml up -d
#
# Prérequis:
#   1. Tailscale installé sur VPS1 ET VPS2 (même compte, auth key)
#   2. .env identique à celui de VPS1 (DATABASE_URL, REDIS_URL, etc.)
#   3. VPS1 a Redis publié sur tailscale0:6379 (via Tailscale + config)

services:
  worker:
    image: ghcr.io/digitaleflex/nba-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file: .env
    environment:
      QUEUE_ENABLED: "true"
      # Connexion à Redis de VPS1 via le réseau privé Tailscale
      REDIS_URL: "redis://:p1aacNszU44FGDmrg4GL8fueudKOc0uG@100.122.171.84:6379"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
