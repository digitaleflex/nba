name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/digitaleflex/nba:latest,ghcr.io/digitaleflex/nba:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/audest/nba
            echo "=== git pull ==="
            git pull
            echo "=== Migrations (avant le boot du container pour eviter le race pgbouncer) ==="
            pnpm prisma migrate deploy 2>&1 | tail -10
            echo "=== docker compose pull (app) ==="
            docker compose pull --ignore-pull-failures app 2>&1 | tail -5
            echo "=== docker compose up -d app ==="
            docker compose up -d app
            echo "=== Status final ==="
            docker compose ps app
            echo "=== Health check (30s pour laisser Next.js demarrer) ==="
            for i in 1 2 3 4 5 6; do
              sleep 5
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 https://access.signauxx.com/login 2>/dev/null || echo "000")
              echo "  check $i (${i}x5s): HTTP $code"
              [ "$code" = "200" ] && break
            done
