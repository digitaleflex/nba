name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-push:
    name: Build + Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/digitaleflex/nba:${{ github.sha }}
            ghcr.io/digitaleflex/nba:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_APP_URL=https://access.signauxx.com
            NEXT_PUBLIC_WS_URL=https://access.signauxx.com:8443

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/digitaleflex/nba-worker:${{ github.sha }}
            ghcr.io/digitaleflex/nba-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 12m
          script: |
            set -e
            cd /home/audest/nba
            SHA="${{ github.sha }}"

            echo "=== Auth GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== Pull image SHA $SHA ==="
            docker pull ghcr.io/digitaleflex/nba:$SHA
            docker pull ghcr.io/digitaleflex/nba-worker:$SHA

            echo "=== Backup ==="
            timeout 300 docker compose -f compose.yml run --rm --entrypoint "sh /app/scripts/backup.sh" worker > /tmp/backup.log 2>&1 || true

            echo "=== Deploy ==="
            sed -i 's/pull_policy: always/pull_policy: never/' compose.yml
            NBA_IMAGE_TAG="$SHA" docker compose up -d --no-deps app worker bull-board 2>&1 | tail -5
            git checkout compose.yml

            echo "=== Migrations ==="
            DIRECT_URL="$(echo "$DATABASE_URL" | sed 's/-pooler//')"
            docker compose -f compose.yml run --rm -e DIRECT_URL="$DIRECT_URL" --entrypoint sh app -c "
              npx prisma migrate deploy 2>&1 || exit \$?
            " > /tmp/migrate.log 2>&1 || { cat /tmp/migrate.log; exit 1; }

            echo "=== Smoke test ==="
            for i in $(seq 1 12); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "https://access.signauxx.com/api/public/health" 2>/dev/null || echo 000)
              echo "  [$i] HTTP $CODE"
              if echo "$CODE" | grep -q '2'; then break; fi
              sleep 5
            done

            echo "=== Cleanup ==="
            docker image prune -f --filter "until=24h"

            echo "✅ Deploy terminé - SHA: $SHA"
