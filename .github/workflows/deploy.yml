name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/digitaleflex/nba:latest,ghcr.io/digitaleflex/nba:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/audest/nba

            echo "=== Pull nouvelles images ==="
            docker compose -f compose.yml pull app worker bull-board 2>&1 | tail -5

            echo "=== Migrations Prisma (one-shot, avant le boot) ==="
            docker compose -f compose.yml run --rm app npx prisma migrate deploy 2>&1 | tail -15

            echo "=== Seed (one-shot, idempotent) ==="
            docker compose -f compose.yml run --rm app pnpm db:seed 2>&1 | tail -10

            echo "=== Rolling deploy zero-down via compose + Traefik healthcheck ==="
            # compose demarre le nouveau container, attend son healthcheck (Traefik
            # ne le route qu'une fois healthy), puis stop l'ancien. Aucune coupure.
            docker compose -f compose.yml up -d --no-deps app worker bull-board 2>&1 | tail -10

            echo "=== Nettoyage des images orphelines ==="
            docker image prune -f

            echo "=== Deploy complete ==="
            docker compose -f compose.yml ps app worker bull-board
