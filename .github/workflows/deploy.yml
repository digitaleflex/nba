name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/digitaleflex/nba:latest,ghcr.io/digitaleflex/nba:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/audest/nba
            echo "=== git pull ==="
            git pull

            echo "=== Migrations (avant le boot du container pour eviter le race pgbouncer) ==="
            pnpm prisma migrate deploy 2>&1 | tail -10

            echo "=== Rolling deploy : pull image ==="
            docker compose pull app 2>&1 | tail -3

            # Recuperer l'ID de l'ancien container (si il existe)
            OLD_CID=$(docker ps -q -f name=nba-app-1 2>/dev/null || echo "")
            echo "Old container: ${OLD_CID:-none}"

            # Demarrer un container temporaire a cote de l'ancien
            # Les deux ont les memes labels Traefik → Traefik equilibre entre les deux
            echo "=== Starting temp container alongside current ==="
            docker compose run -d --name nba-app-next --no-deps --service-ports app

            # Attendre que le nouveau container soit healthy
            echo "=== Waiting for new container to be healthy ==="
            NEW_HEALTHY=false
            for i in $(seq 1 12); do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' nba-app-next 2>/dev/null || echo "starting")
              echo "  Check $i/12: health=$HEALTH"
              if [ "$HEALTH" = "healthy" ]; then
                NEW_HEALTHY=true
                echo "  ✓ New container healthy"
                break
              fi
              sleep 5
            done

            # Si le nouveau container n'est pas healthy → rollback (l'ancien continue de servir)
            if [ "$NEW_HEALTHY" != "true" ]; then
              echo "✗ New container failed to become healthy. Rolling back..."
              docker rm -f nba-app-next 2>/dev/null || true
              exit 1
            fi

            # Stopper l'ancien container proprement
            if [ -n "$OLD_CID" ]; then
              echo "=== Stopping old container gracefully ==="
              docker stop --time 30 "$OLD_CID" || true
              docker rm "$OLD_CID" 2>/dev/null || true
            fi

            # Creer le nouveau container Compose-manage (image deja pull)
            echo "=== Creating Compose-managed container ==="
            docker compose up -d --force-recreate --no-deps app

            # Attendre que le container Compose soit healthy
            echo "=== Waiting for Compose container healthy ==="
            for i in $(seq 1 12); do
              HEALTH=$(docker inspect --format='{{.State.Health.Status}}' nba-app-1 2>/dev/null || echo "starting")
              echo "  Check $i/12: health=$HEALTH"
              if [ "$HEALTH" = "healthy" ]; then
                echo "  ✓ Compose container healthy"
                break
              fi
              sleep 5
            done

            # Nettoyer le container temporaire
            echo "=== Cleaning up ==="
            docker rm -f nba-app-next 2>/dev/null || true

            # Lancer/recycler les services auxiliaires (worker, bull-board)
            echo "=== Starting aux services ==="
            docker compose up -d --no-deps worker bull-board 2>&1 | tail -5

            echo "=== Deploy complete ==="
            docker compose ps app worker bull-board
