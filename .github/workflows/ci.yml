name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm typecheck
      - run: pnpm test:coverage

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.mts', '**/*.js', '**/*.jsx', '**/*.json', '!**/node_modules/**', '!.next/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm build

  prisma:
    name: Prisma Validate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npx prisma validate

  security:
    name: Security Scan + SBOM
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Requis par github/codeql-action/upload-sarif sur un dépôt privé : il lit le run courant
      # (GET /actions/runs/{id}). Sans cela : "Resource not accessible by integration".
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Sans Buildx, le pilote Docker par défaut refuse `cache-to: type=gha`
      # ("Cache export is not supported for the docker driver") : l'image n'était jamais
      # construite, Trivy ne scannait rien et trivy-results.sarif n'existait pas.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nba:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_APP_URL=https://access.signauxx.com
            NEXT_PUBLIC_WS_URL=https://access.signauxx.com:8443
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nba:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      # Rapport toujours disponible, même sans Code scanning (fonction payante sur dépôt privé).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 30
          if-no-files-found: warn
      - if: always()
        name: Résumé du scan Trivy
        run: |
          if [ -f trivy-results.sarif ]; then
            {
              echo "### Trivy — vulnérabilités HIGH/CRITICAL de l'image"
              echo "Total : $(jq '[.runs[].results[]?] | length' trivy-results.sarif)"
              jq -r '[.runs[].results[]?] | group_by(.level) | map("- \(.[0].level) : \(length)") | .[]' trivy-results.sarif
              echo "Rapport complet : artefact \`trivy-sarif\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Envoi vers l'onglet Security > Code scanning. Échoue ("Code scanning is not enabled")
      # tant que la fonction n'est pas activée dans les paramètres du dépôt : non bloquant.
      - if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nba:ci-${{ github.sha }}
          format: spdx-json
          output: nba-sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: nba-sbom.spdx.json
          retention-days: 90
