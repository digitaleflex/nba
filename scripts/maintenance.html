<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Maintenance — NeverBrokeAgain</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    background: linear-gradient(180deg, #0a0e17 0%, #111827 100%);
    background-attachment: fixed;
    color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; min-height: 100vh; padding: 20px;
    touch-action: manipulation;
  }
  .card { text-align: center; max-width: 420px; width: 100%; padding: 0 8px; }
  .spinner {
    width: 44px; height: 44px; margin: 0 auto 28px;
    border: 3px solid rgba(40,59,93,0.25);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    will-change: transform;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: clamp(16px, 5vw, 20px); font-weight: 700;
    letter-spacing: -0.3px; margin-bottom: 6px;
  }
  h1 span { color: #3b82f6; }
  p {
    font-size: clamp(13px, 4vw, 15px); color: #94a3b8;
    line-height: 1.5; margin-bottom: 20px;
    padding: 0 8px;
  }
  .status {
    font-size: clamp(11px, 3.5vw, 13px); color: #64748b;
    margin-bottom: 24px; min-height: 18px; word-break: break-word;
  }
  .btn {
    display: inline-block; padding: 12px 28px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(59,130,246,0.35); background: rgba(59,130,246,0.1);
    color: #60a5fa; font-size: 14px; font-weight: 600; text-decoration: none;
    transition: background 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    min-height: 44px; display: inline-flex; align-items: center;
  }
  .btn:active { background: rgba(59,130,246,0.25); border-color: rgba(59,130,246,0.6); }
  .done .spinner { display: none; }
  .done .status { color: #10b981; }

  @media (max-width: 480px) {
    body { padding: 16px; }
    .card { padding: 0; }
    .btn { width: 100%; justify-content: center; padding: 14px 24px; }
    p { padding: 0 4px; }
  }
</style>
</head>
<body>
<div class="card" id="box">
  <div class="spinner"></div>
  <h1><span>Never</span>BrokeAgain</h1>
  <p>Nous mettons à jour la plateforme. De retour dans quelques instants.</p>
  <p class="status" id="status">
    Vérification en cours...
  </p>
  <button class="btn" onclick="location.reload()">Réessayer maintenant</button>
</div>
<script>
  const CHECK_URL = '/api/public/health';
  const MAX_ATTEMPTS = 60; // 5 minutes max
  let attempts = 0;

  function check() {
    fetch(CHECK_URL, { signal: AbortSignal.timeout(5000) })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.status === 'healthy') {
          document.getElementById('box').classList.add('done');
          document.getElementById('status').textContent = '✓ La plateforme est prête. Redirection...';
          setTimeout(() => location.reload(), 800);
          return;
        }
        scheduleNext();
      })
      .catch(() => scheduleNext());
  }

  function scheduleNext() {
    attempts++;
    if (attempts > MAX_ATTEMPTS) {
      document.getElementById('status').textContent =
        'Cela prend plus de temps que prévu. Réessayez dans quelques minutes.';
      return;
    }
    const wait = attempts <= 10 ? 5 : 10; // 5s les 10 premiers essais, puis 10s
    document.getElementById('status').textContent =
      `Vérification automatique dans ${wait}s... (essai ${attempts}/${MAX_ATTEMPTS})`;
    setTimeout(check, wait * 1000);
  }

  // Premier check après 3 secondes (le temps que Traefik route)
  setTimeout(check, 3000);
</script>
</body>
</html>
