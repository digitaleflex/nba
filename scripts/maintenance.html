<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Maintenance — NeverBrokeAgain</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e17;
    color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 24px;
  }
  .card {
    text-align: center; max-width: 420px; width: 100%;
  }
  .spinner {
    width: 48px; height: 48px; margin: 0 auto 32px;
    border: 3px solid rgba(40,59,93,0.3);
    border-top-color: #283B5D;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 8px; }
  h1 span { color: #3b82f6; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
  .timer { font-size: 12px; color: #64748b; }
  .countdown { font-weight: 700; color: #3b82f6; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h1><span>Never</span>BrokeAgain</h1>
  <p>
    Nous mettons à jour la plateforme pour vous offrir une meilleure expérience.
    <br/>De retour dans quelques instants.
  </p>
  <p class="timer">
    Actualisation automatique dans <span class="countdown" id="sec">30</span> secondes
  </p>
</div>
<script>
  let s = 30;
  setInterval(() => {
    if (s <= 0) { location.reload(); return; }
    document.getElementById('sec').textContent = --s;
  }, 1000);
</script>
</body>
</html>
