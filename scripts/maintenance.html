<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Maintenance — NeverBrokeAgain</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e17;
    color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 24px;
  }
  .card { text-align: center; max-width: 420px; width: 100%; }
  .spinner {
    width: 48px; height: 48px; margin: 0 auto 32px;
    border: 3px solid rgba(40,59,93,0.3);
    border-top-color: #283B5D;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 8px; }
  h1 span { color: #3b82f6; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
  .status { font-size: 12px; color: #64748b; margin-bottom: 20px; min-height: 20px; }
  .btn {
    display: inline-block; padding: 10px 24px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(59,130,246,0.4); background: rgba(59,130,246,0.1);
    color: #60a5fa; font-size: 14px; font-weight: 600; text-decoration: none;
    transition: background 0.2s;
  }
  .btn:hover { background: rgba(59,130,246,0.2); }
  .done .spinner { display: none; }
  .done .status { color: #10b981; }
</style>
</head>
<body>
<div class="card" id="box">
  <div class="spinner"></div>
  <h1><span>Never</span>BrokeAgain</h1>
  <p>Nous mettons à jour la plateforme. De retour dans quelques instants.</p>
  <p class="status" id="status">
    Vérification en cours...
  </p>
  <button class="btn" onclick="location.reload()">Réessayer maintenant</button>
</div>
<script>
  const CHECK_URL = '/api/public/health';
  const MAX_ATTEMPTS = 60; // 5 minutes max
  let attempts = 0;

  function check() {
    fetch(CHECK_URL, { signal: AbortSignal.timeout(5000) })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.status === 'healthy') {
          document.getElementById('box').classList.add('done');
          document.getElementById('status').textContent = '✓ La plateforme est prête. Redirection...';
          setTimeout(() => location.reload(), 800);
          return;
        }
        scheduleNext();
      })
      .catch(() => scheduleNext());
  }

  function scheduleNext() {
    attempts++;
    if (attempts > MAX_ATTEMPTS) {
      document.getElementById('status').textContent =
        'Cela prend plus de temps que prévu. Réessayez dans quelques minutes.';
      return;
    }
    const wait = attempts <= 10 ? 5 : 10; // 5s les 10 premiers essais, puis 10s
    document.getElementById('status').textContent =
      `Vérification automatique dans ${wait}s... (essai ${attempts}/${MAX_ATTEMPTS})`;
    setTimeout(check, wait * 1000);
  }

  // Premier check après 3 secondes (le temps que Traefik route)
  setTimeout(check, 3000);
</script>
</body>
</html>
